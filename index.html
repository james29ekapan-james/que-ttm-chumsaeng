                            <div><label className="block text-sm font-medium text-gray-700 mb-1">สิทธิ์รักษา</label><select value={formData.treatment_right} onChange={e=>setFormData({...formData,treatment_right:e.target.value})} className="w-full border border-gray-300 rounded-lg px-4 py-2"><option>บัตรทอง</option><option>ข้าราชการ</option><option>ประกันสังคม</option><option>ชำระเงินเอง</option><option>อื่นๆ</option></select></div>
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">ผู้ให้บริการ (หมอนวด)</label>
                                <select required className="w-full border border-gray-300 rounded-lg px-4 py-2" value={formData.therapist_id} onChange={e => setFormData({...formData, therapist_id: e.target.value})}>
                                    <option value="">-- เลือกหมอนวด --</option>
                                    {db.therapists.filter(t => !db.leaves.some(l => Number(l.therapist_id) === Number(t.id) && normalizeDateKey(l.date) === formData.appointment_date)).map(t => {
                                        // Calculate current load for selected date
                                        const load = db.appointments.filter(a => normalizeDateKey(a.appointment_date) === formData.appointment_date && Number(a.therapist_id) === Number(t.id) && !['ยกเลิก','ผิดนัด','เลื่อน','เลื่อนนัด'].includes(a.status)).length;
                                        const isLeave = db.leaves.some(l => Number(l.therapist_id) === Number(t.id) && normalizeDateKey(l.date) === formData.appointment_date);
                                        return <option key={t.id} value={t.id} disabled={isLeave || load >= t.max_patients_per_day}>{t.first_name} ({isLeave ? 'ลา / ปิดรับจอง' : `${load}/${t.max_patients_per_day} คิว`})</option>
                                    })}
                                </select>
                                <p className="text-xs text-gray-500 mt-1">* ระบบจะคำนวณคิวว่างตามวันที่เลือกให้อัตโนมัติ</p>
                            </div>
                            <div className="pt-4 flex justify-end gap-3">
                                <Button variant="outline" onClick={() => setIsModalOpen(false)}>ยกเลิก</Button>
                                <Button type="submit">บันทึกการนัด</Button>
                            </div>
                        </form>
                    </Modal>

                    {/* Reschedule Modal */}
                    <Modal isOpen={isRescheduleOpen} onClose={() => setIsRescheduleOpen(false)} title="🔄 เลื่อนนัดผู้ป่วย">
                        {selectedAppoint && (
                            <form onSubmit={handleRescheduleSave} className="space-y-4">
                                <div className="bg-blue-50 p-3 rounded-lg border border-blue-100 text-sm mb-4">
                                    <p><strong>ผู้ป่วย:</strong> {selectedAppoint.patient.first_name} {selectedAppoint.patient.last_name}</p>
                                    <p><strong>นัดเดิม:</strong> {formatThaiDate(selectedAppoint.appointment_date)} เวลา {selectedAppoint.appointment_time}</p>
                                </div>
                                <div className="grid grid-cols-2 gap-4">
                                    <div>
                                        <label className="block text-sm font-medium text-gray-700 mb-1">วันที่นัดใหม่</label>
                                        <input type="date" required className="w-full border border-gray-300 rounded-lg px-4 py-2" value={rescheduleData.new_date} onChange={e => setRescheduleData({...rescheduleData, new_date: e.target.value})} />
                                    </div>
                                    <div>
                                        <label className="block text-sm font-medium text-gray-700 mb-1">เวลาใหม่</label>
                                        <input type="time" required className="w-full border border-gray-300 rounded-lg px-4 py-2" value={rescheduleData.new_time} onChange={e => setRescheduleData({...rescheduleData, new_time: e.target.value})} />
                                    </div>
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">ผู้ให้บริการใหม่</label>
                                    <select required className="w-full border border-gray-300 rounded-lg px-4 py-2" value={rescheduleData.new_therapist_id} onChange={e => setRescheduleData({...rescheduleData, new_therapist_id: e.target.value})}>
                                        {db.therapists.map(t => <option key={t.id} value={t.id}>{t.first_name}</option>)}
                                    </select>
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">เหตุผลการเลื่อน</label>
                                    <select required className="w-full border border-gray-300 rounded-lg px-4 py-2" value={rescheduleData.reason} onChange={e => setRescheduleData({...rescheduleData, reason: e.target.value})}>
                                        <option value="">-- เลือกเหตุผล --</option>
                                        <option value="ผู้ป่วยติดธุระ">ผู้ป่วยติดธุระ</option>
                                        <option value="ผู้ป่วยไม่สะดวก">ผู้ป่วยไม่สะดวก</option>
                                        <option value="แพทย์/เจ้าหน้าที่ขอเลื่อน">แพทย์/เจ้าหน้าที่ขอเลื่อน</option>
                                        <option value="หมอนวดลา">หมอนวดลา</option>
                                    </select>
                                </div>
                                <div className="pt-4 flex justify-end gap-3">
                                    <Button variant="outline" onClick={() => setIsRescheduleOpen(false)}>ยกเลิก</Button>
                                    <Button type="submit">บันทึกเลื่อนนัด</Button>
                                </div>
                            </form>
                        )}
                    </Modal>
                </div>
            );
        };

        const ReschedulesList = () => {
             const { db, selectedDate, setSelectedDate } = useContext(AppContext);
             const rescheduled = db.appointments.filter(a=>normalizeDateKey(a.appointment_date)===selectedDate && ['เลื่อน','เลื่อนนัด'].includes(a.status)).sort((a,b)=>String(a.appointment_time).localeCompare(String(b.appointment_time)));
             return (
                 <div className="space-y-6">
                    <div className="flex flex-col md:flex-row md:items-center justify-between gap-3"><div><h2 className="text-2xl font-bold text-gray-800">ผู้ป่วยเลื่อนนัด</h2><p className="text-sm text-gray-500">ข้อมูลประจำวันที่ {formatFullThaiDate(selectedDate)}</p></div><input type="date" value={selectedDate} onChange={e=>setSelectedDate(e.target.value)} className="border border-gray-300 rounded-lg px-4 py-2"/></div>
                    <Card className="p-0 overflow-hidden">
                        <div className="overflow-x-auto">
                            <table className="w-full text-sm text-left">
                                <thead className="bg-gray-50 text-gray-700 border-b">
                                    <tr>
                                        <th className="py-4 px-6 font-semibold">ผู้ป่วย</th>
                                        <th className="py-4 px-6 font-semibold">วันและเวลา</th>
                                        <th className="py-4 px-6 font-semibold">กิจกรรม</th>
                                        <th className="py-4 px-6 font-semibold">หมอนวด</th>
                                        <th className="py-4 px-6 font-semibold">สถานะ</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-gray-100">
                                    {rescheduled.length===0?<tr><td colSpan="5" className="py-8 text-center text-gray-500">ไม่มีผู้ป่วยเลื่อนนัด</td></tr>:rescheduled.map(a => {
                                        const p = db.patients.find(pt => String(pt.id) === String(a.patient_id));
                                        const t = db.therapists.find(th => Number(th.id) === Number(a.therapist_id));
                                        const s = db.services.find(service => Number(service.id) === Number(a.service_type_id));
                                        return (
                                        <tr key={a.id} className="hover:bg-gray-50">
                                            <td className="py-3 px-6">{a.patient_name || (p ? `${p.first_name} ${p.last_name}` : '-')}</td>
                                            <td className="py-3 px-6">{formatThaiDate(a.appointment_date)} {a.appointment_time}</td>
                                            <td className="py-3 px-6">{s?.service_name || '-'}</td>
                                            <td className="py-3 px-6">{t?.first_name || '-'}</td>
                                            <td className="py-3 px-6"><span className={`px-3 py-1 rounded-full text-xs ${getStatusColor(a.status)}`}>🔵 {a.status}</span></td>
                                        </tr>
                                    )})}
                                </tbody>
                            </table>
                        </div>
                    </Card>
                 </div>
             )
        }
        
        const ReportsExport = () => {
             const handleExportCSV = () => {
                 // Simple mock CSV export
                 const csvContent = "data:text/csv;charset=utf-8,\uFEFF" + "รายงานการมารับบริการประจำเดือน\n";
                 const encodedUri = encodeURI(csvContent);
                 const link = document.createElement("a");
                 link.setAttribute("href", encodedUri);
                 link.setAttribute("download", "report.csv");
                 document.body.appendChild(link);
                 link.click();
             }

             return (
                 <div className="space-y-6">
                    <h2 className="text-2xl font-bold text-gray-800">ออกรายงาน</h2>
                    <Card className="flex flex-col items-center justify-center py-20 text-center">
                        <Icon.Download className="w-16 h-16 text-primary mb-4" />
                        <h3 className="text-xl font-bold mb-2">ดาวน์โหลดรายงานข้อมูลดิบ (Excel/CSV)</h3>
                        <p className="text-gray-500 mb-6">ข้อมูลผู้มารับบริการทั้งหมด พร้อมสถานะและหมอนวดผู้ให้บริการ</p>
                        <Button onClick={handleExportCSV} className="w-48">
                            <Icon.Download /> Export to CSV
                        </Button>
                    </Card>
                 </div>
             )
        }

        // --- Main App Component ---
        const App = () => {
            const [user, setUser] = useState(null);
            const [view, setView] = useState('dashboard');
            const [selectedDate, setSelectedDateState] = useState(() => localStorage.getItem('thaiMassageSelectedDate') || todayStr);
            const [googleSheetUrl, setGoogleSheetUrlState] = useState(() => { localStorage.setItem('thaiMassageGoogleSheetUrl', DEFAULT_GOOGLE_SHEET_WEB_APP_URL); return DEFAULT_GOOGLE_SHEET_WEB_APP_URL; });
            const [googleSyncStatus, setGoogleSyncStatus] = useState('พร้อมใช้งาน');
            const [googleReady, setGoogleReady] = useState(false);
            const syncBusyRef = useRef(false);
            const googleApiVersionRef = useRef('');
            const pendingAddsRef = useRef({});
            const emptyAppointmentReadsRef = useRef(0);
            
            // Database State
            const [db, setDb] = useState(() => { const defaults = {
                users: MOCK_USERS,
                patients: MOCK_PATIENTS,
                therapists: MOCK_THERAPISTS,
                services: MOCK_SERVICES,
                appointments: MOCK_APPOINTMENTS,
                appointmentUpdates: [],
                history: MOCK_HISTORY,
                leaves: [],
                incidents: [],
                customSlots: [
                    {id:1,start:'08:30',end:'09:30',label:'08:30-09:30'},
                    {id:2,start:'09:30',end:'10:30',label:'09:30-10:30'},
                    {id:3,start:'10:30',end:'11:30',label:'10:30-11:30'},
                    {id:4,start:'13:00',end:'14:00',label:'13:00-14:00'},
                    {id:5,start:'14:00',end:'15:00',label:'14:00-15:00'},
                    {id:6,start:'15:00',end:'16:00',label:'15:00-16:00'}
                ]
            }; try { const saved = localStorage.getItem('thaiMassageDatabase'); return saved ? {...defaults,...JSON.parse(saved)} : defaults; } catch(e) { return defaults; } });

            const setGoogleSheetUrl = value => { setGoogleSheetUrlState(value); localStorage.setItem('thaiMassageGoogleSheetUrl', value); };
            const setSelectedDate = value => { setSelectedDateState(value); localStorage.setItem('thaiMassageSelectedDate', value); };
            const loadFromGoogleSheet = () => {
                if (!googleSheetUrl) { setGoogleReady(true); return; }
                if (syncBusyRef.current) return;
                setGoogleSyncStatus('กำลังดึงข้อมูล');
                const callbackName = `googleSheetCallback_${Date.now()}`;
                const script = document.createElement('script');
                let finished = false;
                const cleanup = () => { if(script.parentNode) script.parentNode.removeChild(script); delete window[callbackName]; };
                const timeout = setTimeout(() => { if(!finished){ finished=true; cleanup(); setGoogleReady(true); setGoogleSyncStatus('ดึงข้อมูลไม่สำเร็จ'); } }, 8000);
                window[callbackName] = response => {
                    if(finished) return; finished=true; clearTimeout(timeout); cleanup();
                    googleApiVersionRef.current = response?.apiVersion || '';
                    const validAppointmentPayload = response?.ok && response.initialized && response.apiVersion === EXPECTED_APPS_SCRIPT_VERSION && response.appointmentSource === 'appointments' && response.appointmentMeta?.valid === true && Array.isArray(response?.data?.appointments);
                    if(validAppointmentPayload) {
                        const deferEmptyAppointments = response.data.appointments.length === 0 && emptyAppointmentReadsRef.current < 1;
                        emptyAppointmentReadsRef.current = response.data.appointments.length === 0 ? emptyAppointmentReadsRef.current + 1 : 0;
                        if (!Array.isArray(response.presentCollections)) {
                            setGoogleSyncStatus('Apps Script เป็นเวอร์ชันเก่า กรุณา Deploy เวอร์ชันใหม่');
                        } else {
                            setDb(current => {
                                localStorage.setItem('thaiMassageDatabaseBeforeGooglePull', JSON.stringify(current));
                                const remoteData = {};
                                response.presentCollections.forEach(name => {
                                    if (Object.prototype.hasOwnProperty.call(response.data, name)) {
                                        if(name === 'appointments' && deferEmptyAppointments) return;
                                        let remoteRows = Array.isArray(response.data[name]) ? response.data[name] : [];
                                        if(name === 'appointments') remoteRows = remoteRows.map(row => ({...row,appointment_date:normalizeDateKey(row.appointment_date) || row.appointment_date}));
                                        const remoteIds = new Set(remoteRows.map(row => String(row.id)));
                                        const pendingRows = (pendingAddsRef.current[name] || []).filter(row => !remoteIds.has(String(row.id)));
                                        pendingAddsRef.current[name] = pendingRows;
                                        remoteData[name] = [...remoteRows, ...pendingRows];
                                    }
                                });
                                if (!Array.isArray(remoteData.users) || remoteData.users.length === 0) {
                                    remoteData.users = current.users?.length ? current.users : MOCK_USERS;
                                }
                                return {...current,...remoteData};
                            });
                            setGoogleSyncStatus(deferEmptyAppointments ? 'Google Sheet ส่งรายการนัดว่างครั้งแรก ระบบเก็บข้อมูลเดิมไว้และจะตรวจซ้ำ' : 'อัปเดตจาก Google Sheet แล้ว');
                        }
                    } else if (response?.ok && response.apiVersion !== EXPECTED_APPS_SCRIPT_VERSION) setGoogleSyncStatus(`กรุณา Deploy Apps Script เวอร์ชัน ${EXPECTED_APPS_SCRIPT_VERSION}`);
                    else setGoogleSyncStatus(response?.error ? `ไม่ใช้ข้อมูลล่าสุด: ${response.error}` : 'ข้อมูลจาก Google Sheet ไม่สมบูรณ์ ระบบเก็บข้อมูลเดิมไว้');
                    setGoogleReady(true);
                };
                script.onerror = () => { if(!finished){ finished=true; clearTimeout(timeout); cleanup(); setGoogleReady(true); setGoogleSyncStatus('ดึงข้อมูลไม่สำเร็จ'); } };
                script.src = `${googleSheetUrl}?callback=${callbackName}&t=${Date.now()}`;
                document.body.appendChild(script);
            };
            const syncToGoogleSheet = async () => {
                loadFromGoogleSheet();
            };
            const appendToGoogleSheet = async (collection, record) => {
                if (!googleSheetUrl) throw new Error('ยังไม่ได้ตั้งค่า Google Sheet URL');
                if (googleApiVersionRef.current !== EXPECTED_APPS_SCRIPT_VERSION) { setGoogleSyncStatus(`กรุณา Deploy Apps Script เวอร์ชันล่าสุด (${EXPECTED_APPS_SCRIPT_VERSION})`); throw new Error('Apps Script version mismatch'); }
                if (collection !== 'appointmentUpdates') pendingAddsRef.current[collection] = [...(pendingAddsRef.current[collection] || []), record];
                syncBusyRef.current = true; setGoogleSyncStatus('กำลังเพิ่มข้อมูล');
                try {
                    const body = new URLSearchParams(); body.set('collection', collection); body.set('record', JSON.stringify(record));
                    await fetch(googleSheetUrl, {method:'POST',mode:'no-cors',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:body.toString()});
                    setGoogleSyncStatus('เพิ่มข้อมูลแล้ว');
                    setTimeout(loadFromGoogleSheet, 1800);
                } catch(e) { if(collection !== 'appointmentUpdates') pendingAddsRef.current[collection]=(pendingAddsRef.current[collection]||[]).filter(row=>String(row.id)!==String(record.id)); setGoogleSyncStatus('เพิ่มข้อมูลไม่สำเร็จ'); throw e; }
                finally { syncBusyRef.current = false; }
            };

            useEffect(() => {
                localStorage.setItem('thaiMassageDatabase', JSON.stringify(db));
            }, [db]);

            useEffect(() => {
                setGoogleReady(false);
                loadFromGoogleSheet();
                const interval = setInterval(loadFromGoogleSheet, 15000);
                return () => clearInterval(interval);
            }, [googleSheetUrl]);

            // Login Handler
            const handleLogin = (e) => {
                e.preventDefault();
                const form = new FormData(e.target);
                const u = form.get('username');
                const p = form.get('password');
                const loginUsers = db.users?.length ? db.users : MOCK_USERS;
                const foundUser = loginUsers.find(x =>
                    String(x.username ?? '').trim() === String(u ?? '').trim() &&
                    String(x.password ?? '').trim() === String(p ?? '').trim() &&
                    x.active !== false && String(x.active).toLowerCase() !== 'false'
                );
                if (foundUser) {
                    setUser(foundUser);
                    setView(foundUser.role === 'Executive' ? 'executive' : 'dashboard');
                } else {
                    alert('ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง');
                }
            };

            if (!user) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-emerald-50">
                        <div className="max-w-md w-full bg-white p-8 rounded-2xl shadow-lg border border-emerald-100">
                            <div className="text-center mb-8">
                                <img src="welcome-massage-team.png" alt="ตัวการ์ตูนผู้หญิงและผู้ชายไหว้ต้อนรับ" className="w-48 h-72 object-contain rounded-2xl mx-auto mb-5 border-4 border-emerald-100 shadow-md bg-emerald-50" />
                                <h1 className="text-2xl font-bold text-gray-800">ระบบนัดหมายแพทย์แผนไทย</h1>
                                <p className="text-gray-500 mt-2">โรงพยาบาลชุมแสง</p>
                            </div>
                            <form onSubmit={handleLogin} className="space-y-5">
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Username</label>
                                    <input name="username" type="text" required defaultValue="admin" className="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-primary focus:border-primary outline-none transition" />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Password</label>
                                    <input name="password" type="password" required defaultValue="123" className="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-primary focus:border-primary outline-none transition" />
                                </div>
                                <Button type="submit" className="w-full py-3 text-lg">เข้าสู่ระบบ</Button>
                                <div className="text-center mt-4 text-xs text-gray-400">
                                    *Demo accounts: admin/123, staff1/123, exec/123
                                </div>
                            </form>
                        </div>
                    </div>
                );
            }

            // Render active view
            const renderView = () => {
                switch(view) {
                    case 'dashboard': return <DashboardStaff />;
                    case 'executive': return <DashboardExecutive />;
                    case 'appointments': return <Appointments />;
                    case 'reschedules': return <ReschedulesList />;
                    case 'therapists': return <Therapists />;
                    case 'risks': return <RiskReports />;
                    case 'reports': return <ReportsExport />;
                    default: return <div className="p-8 text-center text-gray-500">ระบบกำลังพัฒนาในส่วนนี้</div>;
                }
            };

            return (
                <AppContext.Provider value={{ db, setDb, user, googleSheetUrl, setGoogleSheetUrl, googleSyncStatus, syncToGoogleSheet, loadFromGoogleSheet, appendToGoogleSheet, selectedDate, setSelectedDate }}>
                    <Layout view={view} setView={setView} currentView={view} user={user} onLogout={() => setUser(null)}>
                        {renderView()}
                    </Layout>
                </AppContext.Provider>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
